name: Build (Windows)

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      # dqrobotics/cpp expects the vcpkg toolchain at C:/vcpkg on Windows.
      - name: Install vcpkg at C:/vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/./bootstrap-vcpkg.bat
          C:/vcpkg/./vcpkg install eigen3:x64-windows

      - name: Build & install dqrobotics
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/dqrobotics/cpp.git dqrobotics/cpp
          cmake -S dqrobotics/cpp -B dqrobotics/cpp/build ^
                -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
                -DVCPKG_TARGET_TRIPLET=x64-windows ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_INSTALL_PREFIX=C:/dqrobotics
          cmake --build dqrobotics/cpp/build --config Release -j
          cmake --install dqrobotics/cpp/build --config Release

      - name: Build marinholab_sas_core
        shell: cmd
        run: |
          cmake -B build ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
                -DVCPKG_TARGET_TRIPLET=x64-windows ^
                -DDQROBOTICS_INCLUDE_DIR=C:/dqrobotics/include ^
                -DDQROBOTICS_LIBRARY=C:/dqrobotics/lib/dqrobotics.lib
          cmake --build build --config Release -j

      - name: Run examples
        run: |
          .\build\Release\sas_core_example.exe
          .\build\Release\sas_clock_example.exe
          .\build\Release\sas_clock_sched_fifo_example.exe
          .\build\Release\thread_manager_example.exe
          .\build\Release\sas_robot_driver_example.exe
